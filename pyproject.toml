[project]
name = "akamodoro"
version = "0.1.0"
requires-python = ">=3.14"

[project.scripts]
akamodoro-client = "akamodoro.client:main"
akamodoro-daemon = "akamodoro.daemon:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]